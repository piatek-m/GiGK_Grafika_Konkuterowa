<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <title>Raymarching CSG — kula + box</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    .op-btn.active {
      background: #4d8fff;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div>
    <div>Operacja CSG</div>
    <button class="op-btn active" data-op="0">Suma - min(a, b)</button>
    <button class="op-btn" data-op="1">Przecięcie - max(a, b)</button>
    <button class="op-btn" data-op="2">Różnica - max(a, -b)</button>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const vertexShader = `
      void main() {
        gl_Position = vec4(position, 1.0);
      }
      `;

    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform int u_operation; 

      #define MAX_STEPS 100
      #define MAX_DIST  100.0
      #define SURF_DIST 0.001

      float sdBox(vec3 p, vec3 b) {
        vec3 q = abs(p) - b;
        return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
      }
        
      mat3 rotateX(float a) {
        float s = sin(a), c = cos(a);
        return mat3(
          1.0, 0.0, 0.0,
          0.0,   c,   s,
          0.0,  -s,   c
        );
      }

      mat3 rotateY(float a) {
        float s = sin(a), c = cos(a);
        return mat3(
            c, 0.0,  -s,
          0.0, 1.0, 0.0,
            s, 0.0,   c
        );
      }

      float surfaceNoise(vec3 dir, float t) {
        float n  = sin(dir.x * 6.0  + t * 1.6);
              n += sin(dir.y * 8.0  - t * 1.1);
              n += sin(dir.z * 7.0  + t * 2.0);
              n += sin((dir.x + dir.z) * 5.0 - t * 0.7) * 0.5;
        return n;
      }

      float sdSphereNoisy(vec3 p, vec3 center, float baseRadius, float t) {
        vec3 q   = p - center;
        vec3 dir = normalize(q);                 
        float bump = surfaceNoise(dir, t) * 0.12; 
        return length(q) - (baseRadius + bump);
      }


      float sdBoxAnimated(vec3 p, vec3 center, float t) {
        vec3 q = p - center;
        q = rotateY(t * 0.6) * rotateX(t * 0.4) * q;

        vec3 halfExtents = vec3(
          0.65 + 0.20 * sin(t * 1.3),
          0.65 + 0.20 * sin(t * 1.7 + 2.0),
          0.65 + 0.20 * sin(t * 0.9 + 4.0)
        );

        return sdBox(q, halfExtents);
      }

      vec2 opUnion(vec2 a, vec2 b) {   
        return (a.x < b.x) ? a : b;
      }

      vec2 opIntersect(vec2 a, vec2 b) {  
        return (a.x > b.x) ? a : b;
      }

      vec2 opDifference(vec2 a, vec2 b) {   
        float negB = -b.x;
        return (a.x > negB) ? a : vec2(negB, b.y);
      }

      vec2 scene(vec3 p) {
        vec3 sphereCenter = vec3(cos(u_time * 0.7) * 1.8, 0.0, sin(u_time * 0.7) * 1.8);
        vec3 boxCenter     = vec3(0.0);

        vec2 sph = vec2(sdSphereNoisy(p, sphereCenter, 0.85, u_time), 0.0); 
        vec2 box = vec2(sdBoxAnimated(p, boxCenter, u_time),          1.0); 

        if (u_operation == 0) return opUnion(sph, box);
        if (u_operation == 1) return opIntersect(sph, box);
        return opDifference(sph, box);
      }

      vec3 calcNormal(vec3 p) {
        vec2 e = vec2(0.001, 0.0);
        return normalize(vec3(
          scene(p + e.xyy).x - scene(p - e.xyy).x,
          scene(p + e.yxy).x - scene(p - e.yxy).x,
          scene(p + e.yyx).x - scene(p - e.yyx).x
        ));
      }

      vec2 rayMarch(vec3 ro, vec3 rd) {
        float d  = 0.0;
        float id = -1.0; 
        for (int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * d;
          vec2 hit = scene(p);
          if (hit.x < SURF_DIST) { id = hit.y; break; }
          d += hit.x;
          if (d > MAX_DIST) break;
        }
        return vec2(d, id);
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;

        vec3 ro = vec3(0.0, 1.2, 6.5);
        vec3 rd = normalize(vec3(uv, -1.5));

        vec2 hit = rayMarch(ro, rd);
        float d  = hit.x;
        float id = hit.y;

        vec3 col = vec3(0.05, 0.05, 0.1);

        if (d < MAX_DIST && id >= 0.0) {
          vec3 p = ro + rd * d;
          vec3 n = calcNormal(p);

          vec3 lightPos = vec3(3.0, 5.0, 4.0);
          vec3 lightDir = normalize(lightPos - p);
          vec3 viewDir  = normalize(ro - p);
          vec3 halfDir  = normalize(lightDir + viewDir);

          float diff = max(dot(n, lightDir), 0.0);
          float spec = pow(max(dot(n, halfDir), 0.0), 48.0);
          float amb  = 0.10;

          vec3 baseCol = (id < 0.5) ? vec3(0.95, 0.35, 0.25) : vec3(0.25, 0.55, 0.95);

          col = baseCol * (amb + diff * 0.9) + vec3(1.0) * spec * 0.5;
        }

        col = pow(col, vec3(0.4545)); 
        gl_FragColor = vec4(col, 1.0);
      }
      `;

    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms: {
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_time: { value: 0.0 },
        u_operation: { value: 0 }
      }
    });

    scene.add(new THREE.Mesh(geometry, material));

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });

    const opButtons = document.querySelectorAll('.op-btn');
    opButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        opButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        material.uniforms.u_operation.value = parseInt(btn.dataset.op, 10);
      });
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>

</html>
