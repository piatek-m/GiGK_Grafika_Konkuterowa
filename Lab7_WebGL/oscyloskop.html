<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <title>GLSL — najprostszy shader</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';

    // ─────────────────────────────────────────────────────────────────
    // VERTEX SHADER
    // Uruchamia się raz na każdy wierzchołek (rogów płaszczyzny: 4).
    // Jego zadanie: przekazać UV do fragmenta i policzyć pozycję na ekranie.
    // ─────────────────────────────────────────────────────────────────
    const vertexShader = /* glsl */`
  varying vec2 vUv;

  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

    // ─────────────────────────────────────────────────────────────────
    // FRAGMENT SHADER
    // Uruchamia się raz na każdy piksel ekranu (np. 2 miliony razy).
    // Jego zadanie: zwrócić kolor tego piksela.
    // ─────────────────────────────────────────────────────────────────
    const fragmentShader = /* glsl */`
  precision highp float;

  varying vec2 vUv;        // pozycja piksela w przedziale [0..1]
  uniform float u_time;    // czas w sekundach od startu
  uniform float u_offset;
  uniform float u_zoom;
  uniform float u_frequency;

  void main() {
    float x = (vUv.x + u_offset) * u_zoom;
    float waveValue = sin(x * u_frequency - u_time);
    float waveY = 0.5 + 0.2 * waveValue;
    float dist = abs(vUv.y - waveY);
    float intensity = 1.0 - smoothstep(0.0, 0.005, dist);
    float t = (waveValue + 1.0) / 2.0;
    vec3 background = vec3(0.1, 0.1, 0.15);
    vec3 waveColor = mix(vec3(1.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0), t);
    vec3 color = mix(background, waveColor, intensity);
    gl_FragColor = vec4(color, 1.0);
  }
`;

    // ─────────────────────────────────────────────────────────────────
    // Three.js setup
    // ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
    camera.position.z = 1;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // uniformy — zmienne wstrzykiwane z JS do shadera
    const uniforms = {
      u_time: { value: 0.0 },
      u_offset: { value: 0.0 },
      u_zoom: { value: 1.0 },
      u_frequency: { value: 6.0 }
    };

    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms })
    );
    scene.add(mesh);

    const OFFSET_CHANGE_SPEED = 0.01;
    const ZOOM_CHANGE_SPEED = 0.1;
    const FREQ_CHANGE_SPEED = 0.3;

    const keys = {};
    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    function handleKeys() {
      // Offset
      if (keys['ArrowRight'] || keys['KeyD']) uniforms.u_offset.value += OFFSET_CHANGE_SPEED;
      if (keys['ArrowLeft'] || keys['KeyA']) uniforms.u_offset.value -= OFFSET_CHANGE_SPEED;

      // Zoom
      if (keys['ArrowUp'] || keys['KeyW']) uniforms.u_zoom.value += ZOOM_CHANGE_SPEED;
      if (keys['ArrowDown'] || keys['KeyS']) uniforms.u_zoom.value -= ZOOM_CHANGE_SPEED;

      // Frequency
      if (keys['Equal'] || keys['PageUp']) uniforms.u_frequency.value += FREQ_CHANGE_SPEED;
      if (keys['Minus'] || keys['PageDown']) uniforms.u_frequency.value -= FREQ_CHANGE_SPEED;

      // Reset
      if (keys['Home']) {
        uniforms.u_offset.value = 0.0;
        uniforms.u_zoom.value = 1.0;
        uniforms.u_frequency.value = 15.0;
        keys['Home'] = false;
      }

      uniforms.u_zoom.value = Math.max(0.1, uniforms.u_zoom.value);
      uniforms.u_frequency.value = Math.max(0.1, uniforms.u_frequency.value);
    }

    // pętla renderująca — odpalana 60 razy na sekundę
    const clock = new THREE.Clock();

    function tick() {
      handleKeys();
      uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>

</body>

</html>
