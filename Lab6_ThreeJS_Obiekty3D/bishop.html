<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Three.js – Goniec (Bishop)</title>
    <style>
    </style>
    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>

<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 30, 80);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 8, 18);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 3, 0);
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        const key = new THREE.DirectionalLight(0xffffff, 1.4);
        key.position.set(8, 20, 12);
        key.castShadow = true;
        key.shadow.mapSize.set(1024, 1024);
        key.shadow.camera.near = 0.5;
        key.shadow.camera.far = 60;
        key.shadow.camera.left = key.shadow.camera.bottom = -10;
        key.shadow.camera.right = key.shadow.camera.top = 10;
        scene.add(key);

        const fill = new THREE.DirectionalLight(0x8899ff, 0.5);
        fill.position.set(-8, 6, -8);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffffff, 0.3);
        rim.position.set(0, -5, -10);
        scene.add(rim);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        function bishopProfile() {
            return [
                // podstawa
                new THREE.Vector2(0.05, 0.0),
                new THREE.Vector2(2.2, 0.0),
                new THREE.Vector2(2.2, 0.15),
                new THREE.Vector2(2.3, 0.5),
                new THREE.Vector2(2.3, 0.7),
                new THREE.Vector2(2.0, 1.5),
                new THREE.Vector2(1.6, 2.2),
                new THREE.Vector2(1.2, 3.2),

                // talia
                new THREE.Vector2(0.9, 3.8),
                new THREE.Vector2(0.9, 5.7),

                // dolne rondo kapelusza
                new THREE.Vector2(1.2, 5.9),
                new THREE.Vector2(1.7, 6.0),
                new THREE.Vector2(1.7, 6.3),

                // górne rondo kapelusza
                new THREE.Vector2(1.5, 6.3),
                new THREE.Vector2(1.5, 6.5),
                new THREE.Vector2(1.2, 6.6),

                // górna szyjka
                new THREE.Vector2(0.8, 6.7),
                new THREE.Vector2(0.7, 6.9),
                new THREE.Vector2(0.7, 7.1),

                // czapka
                new THREE.Vector2(1.0, 7.6),
                new THREE.Vector2(1.2, 7.9),
                new THREE.Vector2(1.4, 8.2),
                new THREE.Vector2(1.4, 8.4),
                new THREE.Vector2(0.9, 8.7),
                new THREE.Vector2(0.7, 8.8),
                new THREE.Vector2(0.3, 8.85),
            ];
        }

        const blackMat = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.15,
            roughness: 0.35,
            envMapIntensity: 1.0,
        });

        const profile = bishopProfile();
        const latheGeom = new THREE.LatheGeometry(
            profile,
            64,
            0,
            Math.PI * 2
        );
        latheGeom.computeVertexNormals();

        const body = new THREE.Mesh(latheGeom, blackMat);
        body.castShadow = true;
        body.receiveShadow = true;
        scene.add(body);

        /* kulka / pompon czapki */
        const ballGeom = new THREE.SphereGeometry(0.42, 32, 32);
        const ball = new THREE.Mesh(ballGeom, blackMat);
        ball.position.set(0, 9.15, 0);
        ball.castShadow = true;
        scene.add(ball);

        /* linia profilu */
        const profilePoints3D = profile.map(p => new THREE.Vector3(p.x + 0.02, p.y, 0));
        profilePoints3D.push(new THREE.Vector3(0.3, 9.15, 0));
        const profileLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(profilePoints3D),
            new THREE.LineBasicMaterial({ color: "darkgreen" })
        );
        profileLine.position.z = 1.0;
        profileLine.position.x = 1.0;
        profileLine.rotation.y = - Math.PI / 4;
        scene.add(profileLine);

        const wireframe = new THREE.LineSegments(
            new THREE.WireframeGeometry(latheGeom),
            new THREE.LineBasicMaterial({ color: "lightgreen", transparent: true, opacity: 0.1 })
        );
        scene.add(wireframe);

        scene.add(new THREE.AxesHelper(4));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
